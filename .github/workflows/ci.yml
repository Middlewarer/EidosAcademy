name: CI

on:
  push:
    branches: [Main, main, devmain]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eidos_test
          POSTGRES_USER: eidos
          POSTGRES_PASSWORD: eidos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eidos -d eidos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: eidos_test
      DB_USER: eidos
      DB_PASSWORD: eidos_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
      REDIS_URL: eidos-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test courses.tests --noinput

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
